<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Facebook Group Post Scraper</title>
  </head>
  <body>
    <header>
      <h1>Group Post Scraper</h1>
      <p id="context">Checking current tab…</p>
    </header>

    <section class="tally">
      <div>
        <strong id="collected">0</strong>
        <span>waiting to upload</span>
      </div>
      <div>
        <strong id="rendered">0</strong>
        <span>on screen now</span>
      </div>
    </section>

    <!-- Which order the group's feed is being read in. Ranked is a warning,
         not a state: it means posts are being hidden from the run. -->
    <p id="order" class="status"></p>

    <!-- Where this run stops, and why. A date the extension carries. -->
    <p id="mode" class="status"></p>

    <!-- The comment worker: posts handed to the second tab and not yet heard
         back about. A queue that stops moving while posts pile up behind it is
         the one failure of this design that is otherwise invisible. -->
    <p id="queue" class="status"></p>

    <!-- Where the tab is. Nothing on the feed tab navigates, so a tab that is
         off the group's feed is one only the reader can bring back — and a run
         left there collects nothing while looking exactly like a busy one. -->
    <p id="route" class="status"></p>

    <p id="status" class="status"></p>

    <!-- The hand-over to Uplow, which the run does itself when it finishes.
         Reported here; there is nothing to press. -->
    <p id="uploadState" class="status"></p>

    <section id="timing" class="timing" hidden>
      <p class="timing-title">✓ Scrape complete</p>
      <p class="timing-total">Total time <strong id="timingTotal">0s</strong></p>
      <dl class="timing-rows">
        <dt>Collecting</dt>
        <dd id="timingCollect">0s</dd>
        <dt>Draining</dt>
        <dd id="timingDrain">0s</dd>
        <dt>Storing</dt>
        <dd id="timingStore">0s</dd>
      </dl>
    </section>

    <!-- What sets a run going. Loading a group page no longer starts one on its
         own: several groups are worked through in one browser and only the tab
         being looked at can scroll, so the tabs are opened first and started
         one at a time from here. -->
    <!-- Stop is not Clear and not the end of a run: it ends this scrolling
         session, parks whatever the worker still owes, and uploads only the
         posts that are whole. The next Start picks the parked ones up. -->
    <div class="actions">
      <button id="run">Start collecting</button>
      <button id="stop" hidden>Stop</button>
    </div>

    <section id="results" hidden>
      <div class="actions">
        <button id="download">Download JSON</button>
        <button id="copy">Copy JSON</button>
        <button id="clear" class="danger">Clear</button>
      </div>
      <pre id="preview"></pre>
    </section>

    <!-- Generated by `npm run config` from .env.local; absent until then. -->
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
